version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aog
      POSTGRES_USER: aog
      POSTGRES_PASSWORD: aog
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aog -d aog"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: aog-server
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./packages:/app/packages
    ports:
      - "8000:8000"
    command: >
      sh -c "uvicorn aog.backend.main:app --host 0.0.0.0 --port 8000 --reload"

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: aog-dashboard
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - server
    volumes:
      - ./dashboard:/app/dashboard
    ports:
      - "5173:5173"
    command: >
      sh -c "vite --host --port 5173"

volumes:
  postgres_data:
