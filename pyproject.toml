[project]
name = "agentdac"
version = "0.1.0"
description = "AgentDAC — Universal event-based observability for AI agents"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {text = "MIT"}
authors = [
    {name = "Shreyansh Kesarwani", email = "kesarwanishreyansh26@gmail.com"}
]
keywords = ["observability", "ai-agents", "tracing", "graph", "telemetry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "pydantic>=2.8.0,<3",
    "pydantic-settings>=2.3.0,<3",
    "httpx>=0.27.0,<1",
    "python-dotenv>=1.0.0,<2",
    "aiosqlite>=0.22.1",
    "sqlalchemy>=2.0.30,<2.1.0",
    "greenlet>=3.5.6",
    "filelock>=4.0.9",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
server = [
    "asyncpg>=0.29.0,<1",
    "alembic>=1.13.0,<2",
    "python-multipart>=0.0.9,<1",
]

[project.scripts]
agentdac-claude-hook = "integrations.claude_code.hook:main"

[dependency-groups]
dev = [
    "pytest>=8.2.0,<9",
    "pytest-asyncio>=0.23.0,<1",
    "pytest-cov>=5.0.0,<6",
    "ruff>=0.5.0,<1",
    "mypy>=1.10.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/aog-sdk/src/aog", "packages/aog-sdk/src/agentdac", "integrations"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL",  # pylint
    "TRY", # tryceratops
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "LOG", # logging-format
    "TD",  # flake8-todo
]
ignore = [
    "T201",    # print statements allowed in examples
    "ARG001",  # unused-argument in test fixtures
    "ARG002",  # unused-argument in test methods
    "B008",    # FastAPI Depends in function defaults
    "PLR0913", # span/event models need rich parameter lists
    "PLR0917", # positional arguments
    "TRY003",  # standard exception messages
]
per-file-ignores = { "tests/**/test_*.py" = [
    "PLR2004", # magic values are fine in test assertions
    "T201",    # print statements allowed in tests
    "F841",    # test context variables
    "PLC0415", # deferred test imports
    "TRY301",  # inline raises in tests
], "scripts/**" = [
    "PLR2004", # magic constants in demo generators
    "T201",    # console output in scripts
], "examples/**" = [
    "PLR2004", # magic constants in demo generators
    "PLR0915", # statement count in demonstration script
    "T201",    # console output in examples
    "E501",    # allow formatted demo prompt lines
], "integrations/**" = [
    "PTH",     # filesystem paths in CLI integration
    "TRY300",  # flow control in setup scripts
    "PLR2004", # status codes
    "PLR0912", # setup CLI branch count
    "E402",    # sys.path mutation in hook script
], "install.py" = [
    "PLC0415", # deferred import in installer
    "RUF059",  # unpacked variables
    "T201",    # console output in installer
] }

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
# Teach mypy about Pydantic models (Field defaults, etc.).
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
implicit_reexport = true
allow_untyped_globals = false
enable_error_code = ["unused-ignore"]
show_error_codes = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "scripts.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["packages"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
precision = 2
